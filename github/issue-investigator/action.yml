name: 'Issue Investigator'
description: 'Investigate a GitHub issue using AI and produce a report'

inputs:
  issue_number:
    description: 'The issue number to investigate'
    required: true
  token:
    description: 'GitHub token for API access'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.19.0'

    - name: Install agent dependencies
      shell: bash
      run: npm ci
      working-directory: ${{ github.action_path }}/../../agents/issue-investigator

    - name: Fetch issue details
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
      run: |
        gh issue view $ISSUE_NUMBER --json title,body,comments > $RUNNER_TEMP/issue.json
      working-directory: ${{ github.workspace }}

    - name: Prepare issue message
      shell: bash
      run: |
        # Read issue JSON and build a formatted message
        TITLE=$(jq -r '.title' $RUNNER_TEMP/issue.json)
        BODY=$(jq -r '.body // "No description provided"' $RUNNER_TEMP/issue.json)
        COMMENTS=$(jq -r '.comments | map(.body) | join("\n---\n")' $RUNNER_TEMP/issue.json)

        # Combine and truncate to ~20,000 chars
        MESSAGE="Issue: $TITLE

        $BODY"

        if [ -n "$COMMENTS" ]; then
          MESSAGE="$MESSAGE

        Comments:
        $COMMENTS"
        fi

        # Truncate to 20,000 chars
        MESSAGE="${MESSAGE:0:20000}"

        # Save to file for safe passing (no shell interpolation)
        echo "$MESSAGE" > $RUNNER_TEMP/issue-message.txt
      working-directory: ${{ github.workspace }}

    - name: Run investigator agent
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ env.OPENROUTER_API_KEY }}
        FLUE_REPO_ROOT: ${{ github.workspace }}
      run: |
        npx flue run src/agents/investigator.ts \
          --message "$(cat $RUNNER_TEMP/issue-message.txt)" \
          --id issue-${{ inputs.issue_number }} \
          --new \
          --json > $RUNNER_TEMP/result.json
      working-directory: ${{ github.action_path }}/../../agents/issue-investigator

    - name: Extract and format report
      id: extract
      shell: bash
      run: |
         # `flue run --json` prints {"outcome":"completed","message":"..."} on success
         # and {"outcome":"failed|aborted","error":{...}} otherwise.
         REPORT=$(jq -r '.message // empty' $RUNNER_TEMP/result.json)

         if [ -z "$REPORT" ]; then
           echo "ERROR: No report generated: $(jq -r '.error.message // "empty reply"' $RUNNER_TEMP/result.json)" >&2
           cat $RUNNER_TEMP/result.json >&2
           echo "Investigation encountered an error or produced empty output" > $RUNNER_TEMP/investigation-report.md
           echo "report_ok=false" >> $GITHUB_OUTPUT
         else
           echo "$REPORT" > $RUNNER_TEMP/investigation-report.md
           echo "report_ok=true" >> $GITHUB_OUTPUT
         fi

         # Also append to step summary
         echo "## Investigation Report for Issue #${{ inputs.issue_number }}" >> $GITHUB_STEP_SUMMARY
         echo "" >> $GITHUB_STEP_SUMMARY
         cat $RUNNER_TEMP/investigation-report.md >> $GITHUB_STEP_SUMMARY
      working-directory: ${{ github.workspace }}

    - name: Upload report artifact
      uses: actions/upload-artifact@v4
      with:
        name: investigation-report-${{ inputs.issue_number }}
        path: ${{ runner.temp }}/investigation-report.md
        retention-days: 30

    - name: Comment on issue with report link
      if: steps.extract.outputs.report_ok == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
      run: |
         ARTIFACT_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

         COMMENT="## 📋 Investigation Report Ready

         The AI issue investigator has analyzed this issue. You can:

         - **View in workflow**: [See full report in GitHub Actions](${ARTIFACT_URL})
         - **Download**: The investigation report is available as an artifact in the workflow run above

         The report includes:
         - Summary of the core issue
         - Relevant files to examine
         - Likely root cause analysis
         - Suggested next steps for debugging/fixing

         [Download Report Artifact](${ARTIFACT_URL}#artifacts)"

         gh issue comment $ISSUE_NUMBER --body "$COMMENT"
      working-directory: ${{ github.workspace }}
